<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDJ Decks</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0e10; --card: #18181c; --well: #0b0b0d; --line: #2a2a30; --raise: #26262c; --text: #ececf0; --mute: #8b8b96;
    --a: #00a8c6; --b: #d1009e; --play: #00a060; --cue: #ff8c00; --sync: #1e78ff;
  }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; -webkit-user-select: none; user-select: none }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line) }
  header h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: .08em }
  #note { color: var(--cue); font-size: 13px }
  #conn { margin-left: auto; color: var(--mute); font-size: 13px }
  #conn::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: #c33 }
  #conn.up::before { background: var(--play) }
  /* Pulsar glitch: a rare split on the wordmark, and a CRT flicker only while Pd is lost */
  header h1 { animation: pg-rgb 8s steps(1) infinite }
  #conn:not(.up) { color: var(--text); animation: pg-flicker 3.4s linear infinite }
  @keyframes pg-rgb { 0%, 95%, 100% { text-shadow: none; transform: none } 96% { text-shadow: -2px 0 #05F9FE, 2px 0 #D646FF } 97% { text-shadow: 2px 0 #05F9FE, -2px 0 #D646FF; transform: translateX(1px) } 98% { text-shadow: -1px 0 #D646FF, 1px 0 #05F9FE; transform: none } 99% { text-shadow: 1.5px 0 #05F9FE, -1.5px 0 #D646FF } }
  @keyframes pg-flicker { 0%, 93%, 100% { opacity: 1 } 94% { opacity: .55 } 95% { opacity: 1 } 97% { opacity: .75 } 98% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { header h1, #conn { animation: none !important } }
  main { display: grid; gap: 12px; padding: 12px 16px; grid-template-columns: 1fr 240px 1fr; grid-template-areas: 'a mix b' 'browser browser side' }
  @media (max-width: 960px) { main { grid-template-columns: 1fr 1fr; grid-template-areas: 'a b' 'mix side' 'browser browser' } }
  .card { min-width: 0; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px }
  .card h2, summary { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--mute) }
  .num { font-variant-numeric: tabular-nums }
  button { font: 600 13px system-ui, sans-serif; letter-spacing: .03em; color: var(--text); background: var(--raise); border: 1px solid #34343c; border-radius: 6px; padding: 8px 10px; cursor: pointer }
  button:active { transform: translateY(1px) }
  button:disabled { opacity: .3; cursor: not-allowed }

  /* decks: border and letter light up in the deck color while it plays */
  .deck.playing { border-color: var(--c) }
  .deck .top { display: flex; align-items: center; gap: 8px }
  .deck .letter { display: grid; place-items: center; width: 24px; height: 24px; border: 1px solid var(--c); border-radius: 4px; font-weight: 700; color: color-mix(in srgb, var(--c) 70%, white) }
  .deck.playing .letter { background: var(--c); color: var(--bg) }
  .deck .title { flex: 1; min-width: 0; font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .deck .eject { padding: 4px 8px; font-size: 11px; color: var(--mute); background: none }
  .readout { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; margin: 6px 0 8px; color: var(--mute) }
  .readout b { font-size: 32px; font-weight: 600; line-height: 1.1; color: var(--text) }
  .bar { position: relative; height: 32px; background: var(--well); border: 1px solid var(--line); border-radius: 5px; cursor: pointer; touch-action: none; overflow: hidden }
  .bar .wave { position: absolute; inset: 0; width: 100%; height: 100% }
  .zoombox { position: relative; margin-top: 6px }
  .zoom { display: block; width: 100%; height: 96px; box-sizing: border-box; background: var(--well); border: 1px solid var(--line); border-radius: 5px }
  .zoombox .zoomctl { position: absolute; top: 4px; right: 4px; display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--mute) }
  .zoombox .zoomctl button { width: 26px; padding: 2px 0 }
  .bar .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: color-mix(in srgb, var(--c) 45%, transparent); border-right: 2px solid var(--c) }
  .bar .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--cue); font: normal 10px/1 system-ui, sans-serif }
  .bar .tick::after { content: attr(data-n); position: absolute; top: 2px; left: 4px; color: var(--cue) }
  .bar .loop { --loop: #3fd28b; position: absolute; top: 0; bottom: 0; box-sizing: border-box; border: 2px solid var(--loop); border-width: 0 2px; background: color-mix(in srgb, var(--loop) 15%, transparent); font: 600 9px/1 system-ui, sans-serif; color: var(--loop) }
  .bar .loop.on { background: color-mix(in srgb, var(--loop) 35%, transparent) }  /* looping */
  .bar .loop.open { border-right: 0 }  /* IN set, waiting for OUT */
  .bar .loop::before { content: 'IN'; position: absolute; bottom: 3px; right: calc(100% + 3px) }  /* outside, so a short loop stays readable */
  .bar .loop:not(.open)::after { content: 'OUT'; position: absolute; bottom: 3px; left: calc(100% + 3px) }
  .bar .hint { display: none; position: absolute; right: 8px; top: 8px; font-size: 11px; color: var(--mute) }
  .deck.playing .bar .hint { display: block }
  .transport { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0 }
  .transport .on[data-k=play] { background: var(--play); border-color: var(--play) }
  .transport .on[data-k=sync] { background: var(--sync); border-color: var(--sync) }
  .transport .on[data-k=shift] { background: var(--text); color: var(--bg) }
  .transport [data-k=cue] { color: var(--cue) }
  .transport .on[data-k=pfl], #phones.on { background: var(--c, var(--cue)); border-color: var(--c, var(--cue)); color: #fff }
  .pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px }
  .pads button { position: relative; height: 44px; color: var(--mute) }
  .pads button.on { background: color-mix(in srgb, var(--c) 70%, black); color: #fff }
  .shift .pads button.on { outline: 1px dashed var(--text); outline-offset: -4px }  /* tap now deletes */
  .pads button.lit::after { content: ''; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--c) }  /* controller pad LED */
  .shift .pads button.lit::after, .pads button.on.lit::after { background: #fff }
  .knobs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; text-align: center; color: var(--mute); font-size: 11px }
  .meter { height: 6px; margin-top: 3px; background: var(--well); border-radius: 3px; overflow: hidden }
  .meter.bi { background: linear-gradient(90deg, transparent calc(50% - 1px), var(--line) 0 calc(50% + 1px), transparent 0), var(--well) }
  .meter i { display: block; height: 100%; width: 0; background: var(--c) }

  /* mixer + side */
  .mixer { display: flex; flex-direction: column; gap: 12px; grid-area: mix }
  .vu-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--mute) }
  .vu { position: relative; flex: 1; height: 12px; background: var(--well); border-radius: 3px; overflow: hidden }
  .vu i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--play) 70%, #e5c100 85%, #e53935) }
  .vu b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text) }
  .xf-labels { display: flex; justify-content: space-between; font-weight: 700 }
  .xf-labels :first-child { color: color-mix(in srgb, var(--a) 70%, white) }
  .xf-labels :last-child { color: color-mix(in srgb, var(--b) 70%, white) }
  input[type=range] { width: 100%; height: 36px; margin: 0; background: none; -webkit-appearance: none; appearance: none }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--a), var(--b)) }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--a), var(--b)) }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 34px; margin-top: -14px; border: 1px solid var(--bg); border-radius: 4px; background: #d8d8e0 }
  input[type=range]::-moz-range-thumb { width: 22px; height: 34px; border: 1px solid var(--bg); border-radius: 4px; background: #d8d8e0 }
  #trfx.on { background: var(--text); border-color: var(--text); color: var(--bg) }
  .side { grid-area: side; display: flex; flex-direction: column; gap: 12px }
  summary { margin: 0; cursor: pointer }
  details[open] summary { margin-bottom: 10px }
  .setup { display: flex; flex-direction: column; gap: 8px }
  .modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px }
  .modes button { padding: 8px 4px; font-size: 11px; text-transform: uppercase }
  .modes button.on, .padmodes button.on { background: var(--text); color: var(--bg) }
  .padmodes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 6px }
  .padmodes button { padding: 5px 4px; font-size: 11px; text-transform: uppercase }
  .keys { margin: 4px 0 0; color: var(--mute); font-size: 11px }
  canvas { width: 100%; height: 120px; display: block; background: var(--well); border-radius: 5px }

  /* browser */
  .browser { grid-area: browser; display: flex; flex-direction: column; height: 60vh; min-height: 320px }
  .browser .tools { display: flex; gap: 8px; margin-bottom: 8px }
  #search { flex: 1; min-width: 0; padding: 8px 10px; font: inherit; color: var(--text); background: var(--well); border: 1px solid var(--line); border-radius: 6px; -webkit-user-select: text; user-select: text }
  .status { display: flex; gap: 12px; margin-bottom: 6px; color: var(--mute); font-size: 12px }
  #folderName { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  #loadNote { color: var(--cue) }
  ol { flex: 1; margin: 0; padding: 0; overflow-y: auto; list-style: none; border-top: 1px solid var(--line) }
  li { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-bottom: 1px solid #1f1f24; cursor: pointer }
  li.sel { background: #2c2c36; box-shadow: inset 0 0 0 1px #4a4a56 }
  li .n { width: 4ch; text-align: right; color: var(--mute) }
  li .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  li button { width: 44px; padding: 7px 0; border: 0; color: #fff }
  li button.a { background: var(--a) }
  li button.b { background: var(--b) }

  /* phone: browse and load first, compact decks */
  @media (max-width: 640px) {
    main { grid-template-columns: 1fr; grid-template-areas: 'browser' 'a' 'b' 'mix' 'side' }
    .browser { height: 50vh; min-height: 280px }
    .knobs, #scopeCard { display: none }
    .readout b { font-size: 28px }
  }

  dialog { width: min(520px, 92vw); padding: 0; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 10px }
  dialog::backdrop { background: #000a }
  dialog header { border: 0 }
  #dirPath { padding: 0 16px 8px; color: var(--mute); font-size: 12px; word-break: break-all }
  #dirs { max-height: 50vh; overflow-y: auto; border-top: 1px solid var(--line) }
  #dirs div { padding: 11px 16px; border-bottom: 1px solid #1f1f24; cursor: pointer }
  #dirs div:hover { background: #222228 }
  dialog footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px }
</style>

<header><h1>DDJ-200</h1><span id="note" role="status"></span><span id="conn">connecting…</span></header>
<main>
  <section class="card deck" id="deck1" style="--c: var(--a); grid-area: a"></section>
  <section class="card deck" id="deck2" style="--c: var(--b); grid-area: b"></section>

  <section class="card mixer">
    <h2>Mixer</h2>
    <div class="vu-row">MASTER<div class="vu"><i id="vu"></i><b id="peak"></b></div></div>
    <div><div class="xf-labels"><span>A</span><span>B</span></div><input id="xf" type="range" min="0" max="127" value="64" aria-label="crossfader"></div>
    <button id="trfx">TRANSITION FX</button>
    <button id="phones">MASTER CUE</button>
  </section>

  <div class="side">
    <section class="card" id="scopeCard"><h2>Scope</h2><canvas id="scope" width="480" height="120"></canvas></section>
    <details class="card">
      <summary>Setup</summary>
      <div class="setup">
        <h2>Pad lights</h2><div class="modes" id="modes"></div>
        <button id="calibrate">CALIBRATE</button>
        <p class="keys">Keys: ↑ ↓ browse, A / B load, / search</p>
      </div>
    </details>
  </div>

  <section class="card browser">
    <div class="tools"><input id="search" type="search" placeholder="Search songs…" autocomplete="off"><button id="folderBtn">Folder…</button></div>
    <div class="status"><span id="folderName"></span><span id="loadNote"></span></div>
    <ol id="list"></ol>
  </section>
</main>

<dialog id="dlg">
  <header><h1>Choose music folder</h1></header>
  <div id="dirPath"></div>
  <div id="dirs"></div>
  <footer><button id="dlgCancel">Cancel</button><button id="dlgUse">Use this folder</button></footer>
</dialog>

<template id="deckTpl">
  <div class="top"><span class="letter"></span><span class="title">No track</span><button class="eject">EJECT</button></div>
  <div class="readout num"><b data-v="left">−0:00</b><span><span data-v="time">0:00</span> / <span data-v="length">0:00</span></span><span><span data-v="bpm">-</span> BPM</span><span data-v="rate">0.0%</span></div>
  <div class="bar"><canvas class="wave"></canvas><div class="fill"></div><div class="loop" hidden></div><span class="hint">hold to seek</span></div>
  <div class="zoombox"><canvas class="zoom"></canvas><div class="zoomctl"><button data-z="2" title="zoom out">−</button><span class="zoomspan"></span><button data-z="0.5" title="zoom in">+</button></div></div>
  <div class="transport">
    <button data-k="shift" title="next pad tap deletes its cue">SHIFT</button><button data-k="cue">CUE</button><button data-k="play">PLAY</button><button data-k="sync">SYNC</button><button data-k="pfl" title="headphone cue">PHONES</button>
  </div>
  <div class="padmodes"><button data-pm="0">Hot cue</button><button data-pm="1">Beat loop</button><button data-pm="2">Loop roll</button><button data-pm="3">Manual</button></div>
  <div class="pads"></div>
  <div class="knobs">
    <div>LOW<div class="meter bi"><i data-m="loweq"></i></div></div><div>MID<div class="meter bi"><i data-m="mideq"></i></div></div>
    <div>HIGH<div class="meter bi"><i data-m="higheq"></i></div></div><div>VOL<div class="meter"><i data-m="volume"></i></div></div>
  </div>
</template>

<script>
  // The page sends the same messages the DDJ-200 does (see server.mjs for the list) and shows what [ddj-web] reports.
  const $ = (s, el = document) => el.querySelector(s)
  const S = {}                      // latest values from Pd, e.g. S['d1-pos'] = [0.42]
  let songs = []
  let dirty = true
  const v = (k, i = 0) => S[k]?.[i]
  let noteTimer
  const note = (t) => { $('#note').textContent = t; clearTimeout(noteTimer); noteTimer = setTimeout(() => ($('#note').textContent = ''), 3000) }
  const send = (msg) => fetch('/cmd', { method: 'POST', body: msg })
    .then((r) => r.ok || note(v('pd') ? `Not sent: ${msg}` : 'Pd not connected'))
    .catch(() => note('Server not reachable'))
  const name = (p) => String(p ?? '').split('/').pop().replace(/\.[^.]+$/, '')
  const secs = (t) => { const [m, s] = String(t ?? '0:00').split(':'); return +m * 60 + +s || 0 }
  const toggle = (b, on) => { b.classList.toggle('on', on); b.setAttribute('aria-pressed', on) }
  const throttle = (fn, ms = 40) => { let t = 0; return (...a) => { const now = Date.now(); if (now - t >= ms) { t = now; fn(...a) } } }

  // pad modes (ddj-loops): beat loop / loop roll sizes in beats
  const padLabels = [[1, 2, 3, 4, 5, 6, 7, 8], ['1/4', '1/2', 1, 2, 4, 8, 16, 32], ['1/16', '1/8', '1/4', '1/2', 1, 2, 4, 8], ['IN', 'OUT', 'RELOOP', '', '', '', '', '']]
  const padTitles = ['tap: set / jump to cue · SHIFT, shift-click or right-click: delete',
    'tap: loop this many beats · tap the lit pad, SHIFT or right-click: exit', 'hold: roll this many beats, the track carries on underneath',
    'IN: loop start here · OUT: loop end here, starts looping · RELOOP: exit, or jump back into the loop']

  // decks; SHIFT latches for one pad tap (touch has no shift key), like holding SHIFT on the controller
  const shift = { 1: false, 2: false }
  for (const d of [1, 2]) {
    const el = $(`#deck${d}`)
    el.append($('#deckTpl').content.cloneNode(true))
    $('.letter', el).textContent = d === 1 ? 'A' : 'B'
    for (let i = 1; i <= 8; i++) {
      const b = document.createElement('button')
      b.textContent = i
      b.onpointerdown = (e) => {
        if (e.button) return
        b.setPointerCapture(e.pointerId)
        send(`d${d}-hotcue-${e.shiftKey || shift[d] ? 'off' : 'on'} ${i}`)
        shift[d] = false
        dirty = true
      }
      b.onpointerup = () => send(`d${d}-pad-up ${i}`)  // ends a loop roll
      b.oncontextmenu = (e) => { e.preventDefault(); send(`d${d}-hotcue-off ${i}`) }
      $('.pads', el).append(b)
      const t = document.createElement('i')
      t.className = 'tick'
      t.dataset.n = i
      $('.bar', el).append(t)
    }
    el.querySelectorAll('.transport button').forEach((b) => {
      b.onclick = () => {
        if (b.dataset.k === 'shift') { shift[d] = !shift[d]; dirty = true }
        else send(`d${d}-${b.dataset.k} 127`)
      }
    })
    $('.eject', el).onclick = () => send(`d${d}-eject`)
    el.querySelectorAll('.zoomctl button').forEach((b) => (b.onclick = () => { zoomSpan[d] = Math.min(Math.max(zoomSpan[d] * b.dataset.z, 1), 32) }))
    $('.zoom', el).onwheel = (e) => { e.preventDefault(); zoomSpan[d] = Math.min(Math.max(zoomSpan[d] * (e.deltaY > 0 ? 1.25 : 0.8), 1), 32) }
    el.querySelectorAll('.padmodes button').forEach((b) => (b.onclick = () => send(`d${d}-padmode ${b.dataset.pm}`)))
    // a paused deck seeks on tap; a playing one only after a 300 ms hold, so a stray touch can't jump the track
    const bar = $('.bar', el)
    let armedAt = 0
    const seek = throttle((e) => {
      const r = bar.getBoundingClientRect()
      send(`d${d}-seek-to ${Math.min(Math.max((e.clientX - r.left) / r.width, 0), 0.999).toFixed(4)}`)
    })
    bar.onpointerdown = (e) => {
      bar.setPointerCapture(e.pointerId)
      armedAt = Date.now() + (v(`d${d}-play`) ? 300 : 0)
      if (!v(`d${d}-play`)) seek(e)
    }
    bar.onpointermove = (e) => { if (bar.hasPointerCapture(e.pointerId) && Date.now() >= armedAt) seek(e) }
    bar.onpointerup = (e) => { if (Date.now() >= armedAt) seek(e) }
  }

  // waveforms: dN-wave = peak bins from [ddj-wave], 100 per second spread evenly over the track
  const binMax = (w, a, b) => { let m = 0; for (let i = Math.max(a | 0, 0); i < Math.min(Math.ceil(b), w.length); i++) m = Math.max(m, w[i]); return m }
  const fit = (cv) => {
    const dpr = devicePixelRatio || 1, W = Math.round(cv.clientWidth * dpr), H = Math.round(cv.clientHeight * dpr)
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H }
    return [cv.getContext('2d'), W, H]
  }
  const loudestOf = new WeakMap()   // loudest bin per waveform, so every track fills the height
  const loudest = (w) => { if (!loudestOf.has(w)) loudestOf.set(w, w.reduce((m, x) => Math.max(m, x), 0)); return loudestOf.get(w) }
  // mirrored peaks: x -> bin range [from(x), from(x + 1))
  function drawPeaks(g, W, H, w, from, alpha) {
    const t = loudest(w)
    if (!t) return
    g.globalAlpha = alpha
    for (let x = 0; x < W; x++) {
      const h = Math.max(binMax(w, from(x), Math.max(from(x + 1), from(x) + 1)) / t * H * 0.9, 1)
      g.fillRect(x, (H - h) / 2, 1, h)
    }
    g.globalAlpha = 1
  }
  function paintWave(el, w) {
    const cv = $('.wave', el), [g, W, H] = fit(cv)
    if (cv.drawn === w && cv.drawnW === W) return
    cv.drawn = w; cv.drawnW = W
    g.clearRect(0, 0, W, H)
    g.fillStyle = getComputedStyle(el).getPropertyValue('--c')
    drawPeaks(g, W, H, w, (x) => x * w.length / W, 0.55)
  }

  // zoom: a few seconds around the playhead, scrolling. Pd reports the position 20 times a second,
  // so between reports it is moved on from the play rate
  const zoomSpan = { 1: 4, 2: 4 }   // seconds shown
  const last = { 1: {}, 2: {} }
  function paintZoom(d) {
    const el = $(`#deck${d}`), k = (key) => `d${d}-${key}`, w = S[k('wave')] ?? []
    const cv = $('.zoom', el), [g, W, H] = fit(cv)
    g.clearRect(0, 0, W, H)
    const len = w.length / 100   // seconds
    $('.zoomspan', el).textContent = `${zoomSpan[d]} s`
    if (!len) return
    const L = last[d], pos = S[k('pos')]
    if (L.pos !== pos) { L.pos = pos; L.p = v(k('pos')) ?? 0; L.t = performance.now() }
    const ahead = v(k('play')) ? Math.min((performance.now() - L.t) / 1000, 0.2) * (v(k('rate')) ?? 1) : 0
    const now = L.p * len + ahead, span = zoomSpan[d], t0 = now - span / 2
    const X = (t) => (t - t0) / span * W          // seconds -> px
    const st = getComputedStyle(el), c = st.getPropertyValue('--c'), cue = st.getPropertyValue('--cue')
    // loop region
    const a = v(k('loopin')) ?? -1, b = v(k('loopout')) ?? -1
    if (a >= 0) {
      g.fillStyle = '#3fd28b'
      g.globalAlpha = v(k('padmode')) === 3 && v(k('looppad')) === 2 ? 0.25 : 0.12
      if (b > a) g.fillRect(X(a * len), 0, X(b * len) - X(a * len), H)
      g.globalAlpha = 1
      g.fillRect(X(a * len) - 1, 0, 2, H)
      if (b > a) g.fillRect(X(b * len) - 1, 0, 2, H)
    }
    // beat grid: bars brighter than beats
    const bpm = v(k('tbpm')) ?? 0, fb = v(k('firstbeat')) ?? 0
    if (bpm > 0) {
      const beat = 60 / bpm
      for (let n = Math.ceil((t0 - fb) / beat); fb + n * beat < t0 + span; n++) {
        g.fillStyle = n % 4 ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.35)'
        g.fillRect(Math.round(X(fb + n * beat)), 0, 1, H)
      }
    }
    // peaks: played part dimmer
    g.fillStyle = c
    const from = (x) => (t0 + x / W * span) * 100
    const mid = Math.round(W / 2)
    g.save(); g.beginPath(); g.rect(0, 0, mid, H); g.clip()
    drawPeaks(g, W, H, w, from, 0.4)
    g.restore(); g.save(); g.beginPath(); g.rect(mid, 0, W - mid, H); g.clip()
    drawPeaks(g, W, H, w, from, 0.9)
    g.restore()
    // hot cues
    const dpr = devicePixelRatio || 1
    g.font = `${10 * dpr}px system-ui, sans-serif`
    g.fillStyle = cue;
    (S[k('cues')] ?? []).forEach((q, i) => {
      if (!(q > 0)) return
      g.fillRect(X((q - 1) * len) - 1, 0, 2, H)
      g.fillText(i + 1, X((q - 1) * len) + 3, 11 * dpr)
    })
    // playhead
    g.fillStyle = '#fff'
    g.fillRect(mid - 1, 0, 2, H)
  }

  function paintDeck(d) {
    const el = $(`#deck${d}`), k = (key) => `d${d}-${key}`
    const title = v(k('title')), playing = !!v(k('play'))
    el.classList.toggle('playing', playing)
    el.classList.toggle('shift', shift[d])
    $('.title', el).textContent = title && title !== '-' ? name(title) : 'No track'
    $('[data-v=time]', el).textContent = v(k('time')) ?? '0:00'
    $('[data-v=length]', el).textContent = v(k('length')) ?? '0:00'
    const left = Math.max(secs(v(k('length'))) - secs(v(k('time'))), 0)
    $('[data-v=left]', el).textContent = `−${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`
    $('[data-v=bpm]', el).textContent = v(k('bpm')) || '-'
    const rate = ((v(k('rate')) ?? 1) - 1) * 100
    $('[data-v=rate]', el).textContent = `${rate > 0 ? '+' : ''}${rate.toFixed(1)}%`
    paintWave(el, S[k('wave')] ?? [])
    $('.fill', el).style.width = `${(v(k('pos')) ?? 0) * 100}%`
    $('.eject', el).disabled = playing
    $('.eject', el).title = playing ? 'pause the deck to eject' : ''
    toggle($('[data-k=play]', el), playing)
    toggle($('[data-k=sync]', el), !!v(k('sync')))
    toggle($('[data-k=pfl]', el), !!v(k('phones')))
    toggle($('[data-k=shift]', el), shift[d])
    const cues = S[k('cues')] ?? []   // ddjhcN stores cue phase + 1, 0 = empty
    const lights = S['pad-lights'] ?? []
    const mode = v(k('padmode')) ?? 0, loopPad = v(k('looppad')) ?? 0
    el.querySelectorAll('.padmodes button').forEach((b) => toggle(b, +b.dataset.pm === mode))
    el.querySelectorAll('.pads button').forEach((b, i) => {
      b.textContent = padLabels[mode][i]
      b.title = padTitles[mode]
      b.classList.toggle('on', mode ? loopPad === i + 1 : cues[i] > 0)
      b.classList.toggle('lit', lights[(d - 1) * 8 + i] > 0)
    })
    el.querySelectorAll('.tick').forEach((t, i) => {
      t.hidden = mode || !(cues[i] > 0)
      t.style.left = `${(cues[i] - 1) * 100}%`
    })
    const a = v(k('loopin')) ?? -1, b = v(k('loopout')) ?? -1, loop = $('.loop', el)  // manual loop IN / OUT, -1 = not set
    loop.hidden = a < 0
    loop.classList.toggle('open', !(b > a))
    loop.classList.toggle('on', mode === 3 && loopPad === 2)
    loop.style.left = `${a * 100}%`
    loop.style.width = b > a ? `${(b - a) * 100}%` : '0'
    el.querySelectorAll('[data-m]').forEach((m) => {
      const x = (v(k(m.dataset.m)) ?? (m.dataset.m === 'volume' ? 0 : 64)) / 127
      if (m.dataset.m === 'volume') m.style.width = `${x * 100}%`
      else { m.style.marginLeft = `${Math.min(x, 0.5) * 100}%`; m.style.width = `${Math.abs(x - 0.5) * 100}%` }  // EQ knobs are centred
    })
  }

  // mixer
  const xf = $('#xf')
  let draggingXf = false
  let peak = 0
  xf.oninput = throttle(() => send(`master-crossfader ${xf.value}`))
  xf.onpointerdown = () => (draggingXf = true)
  xf.onpointerup = () => { draggingXf = false; send(`master-crossfader ${xf.value}`) }
  $('#trfx').onclick = () => send('master-trfx 127')
  $('#calibrate').onclick = () => send('ddj-calibrate')
  $('#phones').onclick = () => send('master-headmix 127')
  function paintMixer() {
    if (!draggingXf && S['master-crossfader']) xf.value = v('master-crossfader')
    toggle($('#trfx'), !!v('master-trfx'))
    toggle($('#phones'), !!v('master-phones'))
    const level = Math.min(Math.max(((v('master-level') ?? 0) - 40) / 60, 0), 1)
    peak = Math.max(level, peak - 0.005)
    $('#vu').style.width = `${level * 100}%`
    $('#peak').style.left = `calc(${peak * 100}% - 2px)`
  }

  // pad lights
  const modes = ['auto', 'chase', 'ping-pong', 'fill', 'checker', 'eq', 'eq rows', 'off']
  modes.forEach((m, i) => {
    const b = document.createElement('button')
    b.textContent = m
    b.onclick = () => send(`lights-mode ${i}`)
    $('#modes').append(b)
  })
  const paintModes = () => $('#modes').querySelectorAll('button').forEach((b, i) => toggle(b, i === (v('lights-mode') ?? 0)))

  // scope
  const cv = $('#scope'), ctx = cv.getContext('2d')
  const scopeColor = getComputedStyle(document.documentElement).getPropertyValue('--a')
  function paintScope() {
    const data = S.scope ?? []
    ctx.clearRect(0, 0, cv.width, cv.height)
    ctx.strokeStyle = scopeColor
    ctx.lineWidth = 1.5
    ctx.beginPath()
    data.forEach((y, i) => {
      const px = (i / Math.max(data.length - 1, 1)) * cv.width, py = (1 - (y + 1) / 2) * cv.height
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)
    })
    ctx.stroke()
  }

  // browser (deck 1 = A, deck 2 = B; loading only works on a paused deck, Pd enforces it too)
  function renderList() {
    const q = $('#search').value.toLowerCase()
    const frag = document.createDocumentFragment()
    songs.forEach((p, i) => {
      const t = name(p)
      if (q && !t.toLowerCase().includes(q)) return
      const li = document.createElement('li')
      li.dataset.i = i
      li.innerHTML = '<span class="n num"></span><span class="t"></span><button class="a" aria-label="load into deck A">A</button><button class="b" aria-label="load into deck B">B</button>'
      $('.n', li).textContent = i + 1
      $('.t', li).textContent = t
      frag.append(li)
    })
    $('#list').replaceChildren(frag)
    $('#folderName').textContent = songs.length ? `${songs.length} songs · ${songs[0].split('/').slice(0, -1).join('/')}` : 'No songs: choose a folder with .wav or .aif files'
    markSel(true)
    paintLoadButtons()
  }
  let lastSel = -1
  function markSel(force) {
    const sel = v('sel') ?? 0
    if (sel === lastSel && !force) return
    lastSel = sel
    $('li.sel')?.classList.remove('sel')
    const li = $(`li[data-i="${sel}"]`)
    li?.classList.add('sel')
    li?.scrollIntoView({ block: 'nearest' })
  }
  function paintLoadButtons() {
    const busy = []
    for (const [d, c] of [[1, 'a'], [2, 'b']]) {
      const off = !v('pd') || !!v(`d${d}-state`)
      if (v('pd') && off) busy.push(c.toUpperCase())
      document.querySelectorAll(`li button.${c}`).forEach((b) => (b.disabled = off))
    }
    $('#loadNote').textContent = !v('pd') ? 'Pd not connected' : busy.length ? `Pause deck ${busy.join(' / ')} to load` : ''
  }
  $('#list').onclick = (e) => {
    const li = e.target.closest('li')
    if (!li) return
    if (e.target.tagName === 'BUTTON') send(`web-browser load ${e.target.classList.contains('a') ? 1 : 2} ${li.dataset.i}`)
    else send(`web-browser select ${li.dataset.i}`)
  }
  $('#search').oninput = renderList
  $('#search').onkeydown = (e) => {
    const first = $('#list li')
    if (e.key === 'Enter' && first) send(`web-browser select ${first.dataset.i}`)
    if (e.key === 'Escape' || e.key === 'Enter') e.target.blur()
  }

  // keys: ↑ ↓ browse the visible list, A / B load the selected song, / search
  document.onkeydown = (e) => {
    if (e.target.matches('input') || e.metaKey || e.ctrlKey || e.altKey || dlg.open) return
    const lis = [...document.querySelectorAll('#list li')], at = lis.indexOf($('li.sel'))
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault()
      const li = lis[Math.min(Math.max(at + (e.key === 'ArrowDown' ? 1 : -1), 0), lis.length - 1)]
      if (li) send(`web-browser select ${li.dataset.i}`)
    } else if ((e.key === 'a' || e.key === 'b') && at >= 0) $(`button.${e.key}`, lis[at]).click()
    else if (e.key === '/') { e.preventDefault(); $('#search').focus() }
  }

  // folder picker
  const dlg = $('#dlg')
  let dirNow = ''
  async function openDir(path = '') {
    const r = await (await fetch('/dirs?path=' + encodeURIComponent(path))).json()
    if (r.error) return ($('#dirPath').textContent = `Can't open that folder (only folders inside your home folder)`)
    dirNow = r.path
    $('#dirPath').textContent = `${r.path} · ${r.audio} song${r.audio === 1 ? '' : 's'} here`
    const rows = [['..', r.parent], ...r.dirs.map((n) => [n, `${r.path}/${n}`])]
    $('#dirs').replaceChildren(...rows.map(([label, p]) => {
      const div = document.createElement('div')
      div.textContent = label === '..' ? '↑ up' : `${label}/`
      div.onclick = () => openDir(p)
      return div
    }))
  }
  $('#folderBtn').onclick = async () => { await openDir(); dlg.showModal() }
  $('#dlgCancel').onclick = () => dlg.close()
  $('#dlgUse').onclick = async () => {
    const r = await fetch('/folder', { method: 'POST', body: dirNow })
    if (!r.ok) return ($('#dirPath').textContent = (await r.json().catch(() => ({}))).error ?? "Couldn't use that folder")
    dlg.close()
  }

  // updates from Pd, drawn once per frame
  function paint() {
    if (dirty) {
      dirty = false
      $('#conn').classList.toggle('up', !!v('pd'))
      $('#conn').textContent = v('pd') ? 'Pd running' : 'Pd not connected'
      paintDeck(1); paintDeck(2); paintMixer(); paintModes(); paintScope(); markSel(); paintLoadButtons()
    }
    paintZoom(1); paintZoom(2)   // every frame: it scrolls
    requestAnimationFrame(paint)
  }
  requestAnimationFrame(paint)
  addEventListener('resize', () => (dirty = true))  // redraw the waveforms at the new width

  const events = new EventSource('/events')
  events.onmessage = (e) => {
    const m = JSON.parse(e.data)
    if (m.songs) { songs = m.songs; renderList() }
    if (m.state) { for (const k in S) delete S[k]; Object.assign(S, m.state) }
    if (m.k) S[m.k] = m.v
    dirty = true
  }
  events.onerror = () => { S.pd = [0]; dirty = true }
</script>
